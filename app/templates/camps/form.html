{% extends "base.html" %}

{% block title %}Schedule Blood Donation Camp - LifeFlow{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-4">
    <div class="mb-4">
        <a href="{{ url_for('camps.index') }}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
            &larr; Back to Donation Camps
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Schedule Blood Donation Camp</h1>
                <p class="text-xs text-slate-500">Organize mobile blood drives with colleges, corporations, and community groups.</p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center font-bold">
                <i class="fa-solid fa-tent"></i>
            </div>
        </div>

        <form method="POST" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Camp Event Name *</label>
                <input type="text" name="name" required placeholder="e.g. Red Cross Mega Community Blood Drive"
                       class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Organizing Body / Partner *</label>
                    <input type="text" name="organizer" required placeholder="e.g. Rotary Club / Infosys CSR"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Target Blood Units</label>
                    <input type="number" name="target_units" value="100" min="10" max="1000"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Venue / Specific Address *</label>
                <input type="text" name="venue" required placeholder="e.g. Ground Floor Hall, Tech Park Tower 3, Hinjawadi"
                       class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">City *</label>
                    <input type="text" name="city" value="Pune" required
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">State</label>
                    <input type="text" name="state" value="Maharashtra"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Pincode</label>
                    <input type="text" name="pincode" placeholder="411057"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Start Date *</label>
                    <input type="date" name="start_date" value="{{ today.strftime('%Y-%m-%d') }}" required
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">End Date *</label>
                    <input type="date" name="end_date" value="{{ today.strftime('%Y-%m-%d') }}" required
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Operating Hours</label>
                    <input type="text" name="operating_hours" value="09:00 AM - 05:00 PM"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Coordinator / Doctor Name *</label>
                    <input type="text" name="contact_person" required placeholder="Dr. S. Kulkarni"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Contact Phone *</label>
                    <input type="tel" name="contact_phone" required placeholder="+91 98765 43210"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Camp Amenities & Facilities</label>
                <input type="text" name="facilities" value="Air-conditioned blood mobile, certified doctors, refreshments & certificate"
                       class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                <a href="{{ url_for('camps.index') }}" class="px-4 py-2 border border-slate-300 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-50">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs rounded-xl shadow-md shadow-rose-200 transition-all">
                    Schedule Blood Camp
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
