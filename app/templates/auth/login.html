{% extends "base.html" %}

{% block title %}Sign In - LifeFlow Blood Bank{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-rose-600 via-rose-700 to-red-700 px-8 py-8 text-white text-center relative overflow-hidden">
            <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur-sm border border-white/20">
                <i class="fa-solid fa-droplet text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight">LifeFlow Blood Bank</h2>
            <p class="text-rose-100 text-xs mt-1 font-medium">Safe Blood Supply & Inventory Management</p>
        </div>

        <div class="p-8">
            <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
                <div>
                    <label for="identifier" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email or Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <input type="text" id="identifier" name="identifier" required placeholder="admin@bloodbank.com"
                               class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-rose-500 text-sm transition-all">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" id="password" name="password" required placeholder="••••••••"
                               class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-rose-500 text-sm transition-all">
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center space-x-2 text-xs text-slate-600 cursor-pointer">
                        <input type="checkbox" name="remember" class="rounded border-slate-300 text-rose-600 focus:ring-rose-500 h-4 w-4">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="w-full py-2.5 px-4 rounded-xl text-white font-semibold text-sm bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-700 hover:to-red-700 shadow-md shadow-rose-200 transition-all focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In to Portal
                </button>
            </form>

            <!-- Quick Demo Accounts Button -->
            <div class="mt-6 pt-6 border-t border-slate-200">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider text-center mb-3">Quick Demo Logins (Click to Fill)</p>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="fillDemo('admin@bloodbank.com', 'admin123')" class="px-2 py-2 text-xs font-medium rounded-lg bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 text-center transition-colors">
                        <span class="block font-bold">Admin</span>
                        <span class="text-[10px] text-purple-500">Full Access</span>
                    </button>
                    <button type="button" onclick="fillDemo('staff@bloodbank.com', 'staff123')" class="px-2 py-2 text-xs font-medium rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 text-center transition-colors">
                        <span class="block font-bold">Staff</span>
                        <span class="text-[10px] text-sky-500">Donations/Reqs</span>
                    </button>
                    <button type="button" onclick="fillDemo('donor@bloodbank.com', 'donor123')" class="px-2 py-2 text-xs font-medium rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-center transition-colors">
                        <span class="block font-bold">Donor</span>
                        <span class="text-[10px] text-emerald-500">Donor Portal</span>
                    </button>
                </div>
            </div>

            <div class="mt-6 text-center text-xs text-slate-600">
                Are you a voluntary blood donor?
                <a href="{{ url_for('auth.register') }}" class="font-bold text-rose-600 hover:text-rose-700 hover:underline ml-1">Register here</a>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pass) {
    document.getElementById('identifier').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
