{% extends "base.html" %}

{% block title %}Profile Not Found - LifeFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 text-center">
    <div class="w-16 h-16 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h2 class="text-xl font-bold text-slate-900">Donor Profile Not Found</h2>
    <p class="text-xs text-slate-500 mt-2">
        There is currently no medical donor file linked to your account email ({{ current_user.email }}).
    </p>
    <div class="mt-6">
        <a href="{{ url_for('auth.logout') }}" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-semibold hover:bg-slate-800">
            Log Out & Register
        </a>
    </div>
</div>
{% endblock %}
