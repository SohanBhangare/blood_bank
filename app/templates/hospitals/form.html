{% extends "base.html" %}

{% block title %}Register Partner Hospital - LifeFlow{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-4">
    <div class="mb-4">
        <a href="{{ url_for('hospitals.index') }}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
            &larr; Back to Hospitals
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Register Partner Hospital</h1>
                <p class="text-xs text-slate-500">Add healthcare institutions taking blood donations and managing in-house blood banks.</p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center font-bold">
                <i class="fa-solid fa-hospital"></i>
            </div>
        </div>

        <form method="POST" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Hospital / Medical Center Name *</label>
                <input type="text" name="name" required placeholder="e.g. Ruby Hall Clinic & Trauma Center"
                       class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Hospital Type</label>
                    <select name="hospital_type" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                        <option value="Level 1 Trauma & Super-Specialty">Level 1 Trauma & Super-Specialty</option>
                        <option value="Multi-Specialty Hospital">Multi-Specialty Hospital</option>
                        <option value="Government Teaching Hospital">Government Teaching Hospital</option>
                        <option value="Charitable Hospital">Charitable Hospital</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">City *</label>
                    <input type="text" name="city" value="Pune" required
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Address *</label>
                <input type="text" name="address" required placeholder="Street address, locality, area..."
                       class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Contact Phone / Reception *</label>
                    <input type="tel" name="phone" required placeholder="+91 20 6645 5100"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">24x7 Emergency SOS Helpline *</label>
                    <input type="tel" name="emergency_helpline" required placeholder="+91 20 6645 5555"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700 cursor-pointer p-3 rounded-xl border border-slate-200">
                    <input type="checkbox" name="accepts_donations" value="true" checked class="rounded text-rose-600 focus:ring-rose-500">
                    <span>Accepts Walk-in Blood Donations</span>
                </label>
                <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700 cursor-pointer p-3 rounded-xl border border-slate-200">
                    <input type="checkbox" name="blood_bank_inhouse" value="true" checked class="rounded text-rose-600 focus:ring-rose-500">
                    <span>Licensed In-House Blood Bank</span>
                </label>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Current Critical Demands / Urgent Requirements</label>
                <input type="text" name="urgent_requirements" placeholder="e.g. High demand for O- and A- whole blood for surgical ward"
                       class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                <a href="{{ url_for('hospitals.index') }}" class="px-4 py-2 border border-slate-300 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-50">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs rounded-xl shadow-md shadow-rose-200 transition-all">
                    Register Hospital
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
